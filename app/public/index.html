<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docker-enterprise</title>
<style>
  :root { --bg:#0d0f13; --card:#14171c; --node:#1a1e25; --line:#252a33; --text:#d7d9de; --muted:#7d828c; --accent:#2496ed; --ok:#7bbf6a; --err:#e06c75; }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; display:grid; place-items:center; padding:1.25rem;
    background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card { width:100%; max-width:34rem; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.15rem 1.2rem 1rem; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
  .brand { font:.82rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .brand span { color:var(--accent); }
  .pill { display:inline-flex; align-items:center; gap:.4rem; font:.7rem ui-monospace, monospace; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:.2rem .55rem; }
  .pill b { color:var(--text); font-weight:500; }

  /* host */
  .hostcard {
    display:flex; align-items:center; gap:.6rem;
    background:linear-gradient(180deg, var(--node), #16191f);
    border:1px dashed #2c333e; border-radius:10px; padding:.55rem .65rem;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }
  .hostcard svg { flex:0 0 auto; width:20px; height:20px; stroke:var(--accent); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .hinfo { display:flex; flex-direction:column; line-height:1.25; min-width:0; }
  .hname { font:.72rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight:600; }
  .hsub { font:.57rem ui-monospace, monospace; color:var(--muted); }
  .url { margin-left:auto; font:.6rem ui-monospace, monospace; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:.1rem .35rem; white-space:nowrap; }
  .publish { position:relative; height:28px; display:flex; align-items:center; justify-content:center; }
  .publish::before { content:""; position:absolute; top:0; bottom:0; width:2px; border-radius:2px; background:linear-gradient(180deg, rgba(36,150,237,.15), rgba(36,150,237,.7)); box-shadow:0 0 8px rgba(36,150,237,.25); }
  .publish::after { content:""; position:absolute; bottom:-1px; width:0; height:0; border:4px solid transparent; border-top-color:var(--accent); }
  .publish span { position:relative; background:var(--card); padding:0 .4rem; font:.58rem ui-monospace, monospace; color:var(--accent); }

  /* red interna */
  .net { border:1px solid var(--line); border-radius:12px; padding:1.25rem .7rem .8rem; position:relative; }
  .net::before {
    content:"red_empresa · 172.18.0.0/16 · bridge";
    position:absolute; top:-.55rem; left:.8rem; padding:0 .4rem;
    background:var(--card); color:var(--muted);
    font:.6rem ui-monospace, monospace;
  }

  /* tarjetas de servicio */
  .diagram { display:flex; align-items:center; gap:.35rem; }
  .node {
    flex:1; min-width:0; display:flex; flex-direction:column; gap:.4rem;
    background:linear-gradient(180deg, var(--node), #16191f);
    border:1px solid var(--line); border-radius:10px; padding:.65rem .6rem .6rem;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    transition:border-color .3s, box-shadow .3s;
  }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .node svg { width:20px; height:20px; stroke:var(--muted); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; transition:stroke .3s; }
  .led { width:7px; height:7px; border-radius:50%; background:#3a3f47; transition:background .3s, box-shadow .3s; }
  .id { display:flex; align-items:baseline; gap:.3rem; min-width:0; }
  .name { font:.72rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight:600; white-space:nowrap; }
  .port { font:.6rem ui-monospace, monospace; color:var(--muted); }
  .ip { align-self:flex-start; font:.58rem ui-monospace, monospace; color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:.05rem .3rem; white-space:nowrap; }

  .node.ok { border-color:rgba(123,191,106,.35); box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 0 14px rgba(123,191,106,.06); }
  .node.ok svg { stroke:var(--ok); }
  .node.ok .led { background:var(--ok); box-shadow:0 0 0 3px rgba(123,191,106,.12); animation:pulse 2s infinite; }
  .node.err { border-color:rgba(224,108,117,.4); }
  .node.err svg { stroke:var(--err); }
  .node.err .led { background:var(--err); }

  /* barra de conexión azul */
  .link { flex:0 0 46px; position:relative; display:flex; align-items:center; }
  .wire { position:relative; width:100%; height:3px; border-radius:3px; background:#1c222b; overflow:hidden; transition:background .3s, box-shadow .3s; }
  .wire::before {
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent 0%, var(--accent) 45%, #7cc4ff 50%, var(--accent) 55%, transparent 100%);
    transform:translateX(-100%); opacity:0;
  }
  .link.active .wire { background:rgba(36,150,237,.18); box-shadow:0 0 10px rgba(36,150,237,.35); }
  .link.active .wire::before { opacity:1; animation:flow 1.7s linear infinite; }
  .link small { position:absolute; top:calc(50% + .45rem); left:50%; transform:translateX(-50%); font:.53rem ui-monospace, monospace; color:var(--muted); white-space:nowrap; }

  .foot { display:flex; align-items:baseline; justify-content:space-between; gap:.75rem; border-top:1px solid var(--line); margin-top:1.05rem; padding-top:.7rem; font:.7rem ui-monospace, monospace; color:var(--muted); }
  .metric b { color:var(--text); font-size:1rem; font-weight:600; margin-right:.15rem; }
  .right { display:flex; gap:1rem; }

  @keyframes pulse { 0%,100% { box-shadow:0 0 0 3px rgba(123,191,106,.1); } 50% { box-shadow:0 0 0 5px rgba(123,191,106,.03); } }
  @keyframes flow { from { transform:translateX(-100%); } to { transform:translateX(100%); } }

  @media (max-width:430px) {
    .diagram { flex-direction:column; align-items:stretch; }
    .link { flex:0 0 34px; width:100%; justify-content:center; }
    .wire { width:3px; height:100%; }
    .wire::before { background:linear-gradient(180deg, transparent 0%, var(--accent) 45%, #7cc4ff 50%, var(--accent) 55%, transparent 100%); transform:translateY(-100%); }
    .link.active .wire::before { animation:flowv 1.7s linear infinite; }
    .link small { top:50%; left:calc(50% + .8rem); transform:translateY(-50%); }
    @keyframes flowv { from { transform:translateY(-100%); } to { transform:translateY(100%); } }
  }
</style>
</head>
<body>
  <main class="card">
    <header class="head">
      <span class="brand"><span>docker</span>-enterprise</span>
      <span class="pill"><b id="count">—</b> en línea</span>
    </header>

    <div class="hostcard">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      <div class="hinfo">
        <span class="hname">navegador</span>
        <span class="hsub">tu PC · host</span>
      </div>
      <span class="url">localhost:80</span>
    </div>
    <div class="publish"><span>publica 80:80</span></div>

    <section class="net">
      <div class="diagram">
        <div class="node ok" id="n-web">
          <div class="top">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
            <i class="led"></i>
          </div>
          <div class="id"><span class="name">nginx</span><span class="port">:80</span></div>
          <span class="ip">172.18.0.4</span>
        </div>

        <div class="link" id="l-web"><span class="wire"></span><small>:3000</small></div>

        <div class="node" id="n-app">
          <div class="top">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
            <i class="led"></i>
          </div>
          <div class="id"><span class="name">node</span><span class="port">:3000</span></div>
          <span class="ip">172.18.0.3</span>
        </div>

        <div class="link" id="l-app"><span class="wire"></span><small>5432</small></div>

        <div class="node" id="n-db">
          <div class="top">
            <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
            <i class="led"></i>
          </div>
          <div class="id"><span class="name">postgres</span><span class="port">:5432</span></div>
          <span class="ip">172.18.0.2</span>
        </div>
      </div>
    </section>

    <div class="foot">
      <span class="metric"><b id="lat">—</b>ms</span>
      <span class="right">
        <span class="metric"><b id="uptime">—</b>uptime</span>
      </span>
    </div>
  </main>

  <script>
    const nodes = { web: document.getElementById('n-web'), app: document.getElementById('n-app'), db: document.getElementById('n-db') };
    const links = [document.getElementById('l-web'), document.getElementById('l-app')];
    const set = (el, cls) => { el.className = 'node ' + cls; };

    async function refresh() {
      try {
        const r = await fetch('/api/status');
        const s = await r.json();
        const ok = s.db === 'connected';

        set(nodes.web, 'ok');
        set(nodes.app, ok ? 'ok' : 'err');
        set(nodes.db, ok ? 'ok' : 'err');
        links.forEach(l => l.classList.toggle('active', ok));

        document.getElementById('count').textContent = ok ? '3/3' : '1/3';
        document.getElementById('lat').textContent = ok ? s.latencyMs : '—';
        const u = s.uptimeSec || 0;
        document.getElementById('uptime').textContent = u < 60 ? u + 's' : Math.floor(u / 60) + 'm';
      } catch (e) {
        set(nodes.web, 'ok');
        set(nodes.app, 'err');
        set(nodes.db, 'err');
        links.forEach(l => l.classList.remove('active'));
        document.getElementById('count').textContent = '1/3';
        document.getElementById('lat').textContent = '—';
      }
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
