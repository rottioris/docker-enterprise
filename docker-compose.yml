services:
  db:
    image: postgres:15-alpine
    container_name: docker-enterprise-db-1
    networks:
      red_empresa:
        ipv4_address: 172.18.0.2
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 100
    restart: unless-stopped

  app:
    build: ./app
    container_name: docker-enterprise-app-1
    networks:
      red_empresa:
        ipv4_address: 172.18.0.3
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 100
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: docker-enterprise-web-1
    ports:
      - "80:80"
    networks:
      red_empresa:
        ipv4_address: 172.18.0.4
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 100
    restart: unless-stopped

networks:
  red_empresa:
    name: docker-enterprise_red_empresa
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

volumes:
  db_data:
    name: docker-enterprise_db_data
